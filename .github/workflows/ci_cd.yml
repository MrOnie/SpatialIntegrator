name: SpatialIntegrator V2 CI/CD Pipeline

on:
  push:
    branches: [ main, spatialintegrator-v2 ]
  pull_request:
    branches: [ main, spatialintegrator-v2 ]

jobs:
  test-and-validate:
    name: Build and Verify Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies & Package
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run Automated Test Suite (PyTest)
      run: |
        pytest tests/ -v

  build-wheel:
    name: Compile PyPI Distribution Artifacts
    needs: test-and-validate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build Source & Wheel Package
      run: |
        python -m pip install build twine
        python -m build

    - name: Check Package Bundling Integrity
      run: |
        twine check dist/*

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: spatialintegrator-dist
        path: dist/
