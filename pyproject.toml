[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialintegrator"
version = "0.2.0"
description = "Spatially Adaptive Multimodal Consensus Architecture for Sub-Cellular & High-Definition Histology-Omics Integration."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "SpatialIntegrator Scientific Consortium", email = "info@spatialintegrator.org"}
]
keywords = ["spatial-transcriptomics", "vision-foundation-models", "histology-omics", "multimodal-ai", "visium-hd", "xenium"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "scanpy[leiden]>=1.9.0",
    "leidenalg>=0.9.0",
    "igraph>=0.10.0",
    "squidpy>=1.3.0",
    "anndata>=0.9.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "opencv-python-headless>=4.8.0",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "plotly>=5.18.0",
    "streamlit>=1.30.0",
    "scikit-learn",
    "timm>=0.9.0",
    "huggingface_hub>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "flake8",
    "build",
    "twine"
]

[project.urls]
Homepage = "https://github.com/MrOnie/SpatialIntegrator"
Documentation = "https://github.com/MrOnie/SpatialIntegrator#readme"
Repository = "https://github.com/MrOnie/SpatialIntegrator.git"
BugTracker = "https://github.com/MrOnie/SpatialIntegrator/issues"

[tool.setuptools.packages.find]
include = ["spatialintegrator*"]
