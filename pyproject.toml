[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialintegrator"
version = "0.1.0"
description = "A multi-modal framework integrating spatial transcriptomics with H&E images via Vision Transformers."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Antigravity AI", email = "ai@example.com"}
]
dependencies = [
    "scanpy>=1.9.0",
    "squidpy>=1.3.0",
    "anndata>=0.9.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "opencv-python-headless>=4.8.0",
    "numpy",
    "pandas",
    "matplotlib",
    "streamlit>=1.30.0",
    "scikit-learn",
    "timm>=0.9.0",
    "huggingface_hub>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "flake8"
]
